name: Reusable CI Pipeline

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '["18", "20", "22"]'
      run-lint:
        required: false
        type: boolean
        default: true
    outputs:
      build-status:
        description: "Resultado de la construccion"
        value: ${{ jobs.build.outputs.status }}

jobs:
  test-matrix:
    name: test Node.js v${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJson(inputs.node-version) }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js v${{ matrix.node }} con cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Instalacion limpia de dependencias
        run: npm ci

      - name: Ejecutar Linter
        if: ${{ inputs.run-lint }}
        run: npm run-lint

      - name: Ejecutar pruebas unitarias e integracion
        run: npm test -- --coverage

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node${{ matrix.node }}
          path: coverage/
          retention-days: 7

  build:
    name: Build & Package
    needs: test-matrix
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.set-output.outputs.status }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar y Compilar
        run: |
          npm ci
          npm run build

      - name: Guardar Artifact de Produccion
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/
          retention-days: 1

      - id: set-output
        run: echo "status=success" >> $GITHUB_OUTPUT